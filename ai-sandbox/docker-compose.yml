version: '3.8'

services:
  ai-sandbox:
    build: .
    image: ai-sandbox:latest
    container_name: ai-sandbox

    # 网络配置 - 允许访问主机的 Ollama
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # 只挂载必要的目录（只读或受限）
    volumes:
      # 工作区（AI 可以完全操作）
      - ./workspace:/workspace

      # 只读挂载（AI 只能读取，不能修改主机文件）
      - ~/music:/readonly/music:ro
      - ~/Downloads:/readonly/downloads:ro

    # 资源限制（防止占用过多资源）
    deploy:
      resources:
        limits:
          cpus: '4'        # 最多使用 4 核 CPU
          memory: 8G       # 最多使用 8GB 内存
        reservations:
          cpus: '1'
          memory: 2G

    # 安全设置
    security_opt:
      - no-new-privileges:true  # 禁止容器内提权

    # 禁用特权模式（安全）
    privileged: false

    # 限制能力（不给 root 权限）
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE  # 只允许绑定网络端口

    # 只读根文件系统（更安全，但可能影响某些操作）
    # read_only: true
    # tmpfs:
    #   - /tmp

    # 保持容器运行
    stdin_open: true
    tty: true

    # 环境变量
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - PYTHONUNBUFFERED=1
